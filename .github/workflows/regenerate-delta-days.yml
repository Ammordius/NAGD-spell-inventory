# Regenerate delta_daily_YYYY-MM-DD.json.gz from cached Magelo dumps (magelo-dump-<date>).
# Use when delta files exist but are empty/wrong while the dump is still in Actions cache.
#
# Example (May 10–11 vs baseline era 2026-02-09):
#   dates: 2026-05-10,2026-05-11
#   baseline_era_date: 2026-02-09
#   force: true
#
# Requires delta_snapshots/baseline_master_<baseline_era_date>.json.gz in the repo (or restored
# from a baseline cache entry that contains it). Copies that file over baseline_master.json.gz
# before save_daily_delta_from_baseline (which always reads the master path).

name: Regenerate delta daily JSONs

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Comma-separated YYYY-MM-DD (dump dates = delta filenames)"
        required: true
        type: string
      baseline_era_date:
        description: "Optional. Copy baseline_master_<this>.json.gz over baseline_master.json.gz first (e.g. 2026-02-09 for 5/10–5/11)."
        required: false
        type: string
        default: ""
      baseline_cache_date:
        description: "Optional. Exact cache key day magelo-baseline-YYYY-MM-DD to restore before era copy (when archive not in repo yet)."
        required: false
        type: string
        default: ""
      force:
        description: "Delete existing delta_daily_<date>.json.gz before regenerating"
        required: false
        type: boolean
        default: true
      commit_changes:
        description: "Commit and push regenerated delta_daily_*.json.gz to main"
        required: false
        type: boolean
        default: true

concurrency:
  group: regenerate-delta-days
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      dates_json: ${{ steps.parse.outputs.dates_json }}
    steps:
      - id: parse
        env:
          DATES: ${{ inputs.dates }}
        run: |
          python3 << 'PY'
          import json
          import os
          import re
          import sys

          raw = os.environ.get("DATES", "")
          dates = [x.strip() for x in raw.split(",") if x.strip()]
          if not dates:
              print("::error::No dates after parsing", file=sys.stderr)
              sys.exit(1)
          for d in dates:
              if not re.match(r"^\d{4}-\d{2}-\d{2}$", d):
                  print(f"::error::Invalid date: {d}", file=sys.stderr)
                  sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dates_json={json.dumps(dates)}\n")
          print("Dates:", dates)
          PY

  regen:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        date: ${{ fromJson(needs.prepare.outputs.dates_json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Optional — restore baseline bundle from cache
        if: ${{ inputs.baseline_cache_date != '' }}
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            delta_snapshots/baseline_master.json.gz
            delta_snapshots/baseline_master_*.json.gz
          key: magelo-baseline-${{ inputs.baseline_cache_date }}

      - name: Apply baseline era (copy archived baseline over master)
        env:
          ERA: ${{ inputs.baseline_era_date }}
        run: |
          set -euo pipefail
          mkdir -p delta_snapshots
          if [ -z "${ERA}" ]; then
            echo "No baseline_era_date — using repo baseline_master.json.gz as-is."
            exit 0
          fi
          ARCH="delta_snapshots/baseline_master_${ERA}.json.gz"
          if [ ! -f "$ARCH" ]; then
            echo "::error::Missing $ARCH — add it to the repo or set baseline_cache_date so a cache restore provides it."
            exit 1
          fi
          cp -f "$ARCH" delta_snapshots/baseline_master.json.gz
          echo "✓ Copied $ARCH -> baseline_master.json.gz"

      # Exact key only: do not use restore-keys magelo-dump- or a wrong day's dump could be restored.
      - name: Restore Magelo dump for ${{ matrix.date }}
        id: dump-cache
        uses: actions/cache@v5
        with:
          path: |
            character/TAKP_character.txt
            inventory/TAKP_character_inventory.txt
          key: magelo-dump-${{ matrix.date }}

      - name: Fail if dump cache missed
        if: steps.dump-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::No Actions cache hit for magelo-dump-${{ matrix.date }}. Cache may have expired; regenerate is not possible from CI."
          exit 1

      - name: Remove existing delta (force)
        if: ${{ github.event.inputs.force != 'false' }}
        run: |
          rm -f "delta_snapshots/delta_daily_${{ matrix.date }}.json.gz" "delta_snapshots/delta_daily_${{ matrix.date }}.json" || true

      - name: Generate delta_daily_${{ matrix.date }}.json.gz
        run: |
          mkdir -p character inventory delta_snapshots
          cat > /tmp/regen_one_day.py << 'ENDPY'
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from generate_spell_page import parse_character_data, parse_inventory_file
          from delta_storage import save_daily_delta_from_baseline

          target = sys.argv[1]
          char_data = parse_character_data("character/TAKP_character.txt", None)
          char_ids = {}
          with open("character/TAKP_character.txt", "r", encoding="utf-8") as f:
              next(f)
              for line in f:
                  parts = line.strip().split("\t")
                  if len(parts) >= 9:
                      char_ids[parts[0]] = parts[8]
          inv_data = parse_inventory_file("inventory/TAKP_character_inventory.txt", char_ids)
          save_daily_delta_from_baseline(
              char_data, inv_data, target, "delta_snapshots", auto_reset_baseline=False
          )
          print("OK", target)
          ENDPY
          python /tmp/regen_one_day.py "${{ matrix.date }}"

      - name: Upload generated delta
        uses: actions/upload-artifact@v4
        with:
          name: delta-daily-${{ matrix.date }}
          path: delta_snapshots/delta_daily_${{ matrix.date }}.json.gz
          if-no-files-found: error

  commit:
    needs: regen
    if: success() && github.event.inputs.commit_changes != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all regenerated deltas
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: delta-daily-*
          merge-multiple: true

      - name: Copy into delta_snapshots and commit
        run: |
          set -euo pipefail
          mkdir -p delta_snapshots
          find artifacts -type f -name 'delta_daily_*.json.gz' -print -exec cp -f {} delta_snapshots/ \;
          ls -la delta_snapshots/delta_daily_*.json.gz | tail -20
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add delta_snapshots/delta_daily_*.json.gz
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Regenerate delta_daily JSONs (manual workflow)"
          git push
