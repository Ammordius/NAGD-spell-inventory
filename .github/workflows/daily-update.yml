name: Daily Spell Inventory Update

# Artifact retention: set to 3 days via upload step to stay under 500MB limit (~40MB per run).
on:
  schedule:
    # Run daily at 16:40 UTC (10 minutes after Magelo update at 16:30 UTC)
    - cron: '40 16 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    # Run on any push to main (not just specific files) to ensure it runs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-spell-inventory:
    runs-on: ubuntu-latest
    outputs:
      normalized_date: ${{ steps.check-update.outputs.normalized_date }}
    concurrency:
      group: "update-spell-inventory"
      cancel-in-progress: true
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Check TAKP export page for update date
      id: check-update
      run: |
        echo "Fetching TAKP export page to check last update date..."
        EXPORT_PAGE=$(curl -sL "https://www.takproject.net/magelo/export/")
        
        # Extract the date line (format: "Fri Feb 6 16:30:25 UTC 2026" or "Fri Feb  6 16:30:25 UTC 2026")
        # The date may have variable whitespace, so we'll extract from the span tag and clean it
        echo "Looking for date in span tag..."
        UPDATE_DATE_RAW=$(echo "$EXPORT_PAGE" | grep -oE '<span[^>]*class="updated"[^>]*>[^<]*</span>' | head -1)
        
        if [ -n "$UPDATE_DATE_RAW" ]; then
          echo "Found span tag: $UPDATE_DATE_RAW"
          # Extract just the date part, removing HTML tags and normalizing whitespace
          UPDATE_DATE=$(echo "$UPDATE_DATE_RAW" | sed 's/<[^>]*>//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/[[:space:]]\+/ /g')
          echo "Extracted date: $UPDATE_DATE"
        else
          echo "Warning: Could not find span tag with updated class"
          # Fallback: try pattern matching with flexible whitespace
          UPDATE_DATE=$(echo "$EXPORT_PAGE" | grep -oE '[A-Z][a-z]{2} [A-Z][a-z]{2}\s+[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC [0-9]{4}' | head -1 | sed 's/[[:space:]]\+/ /g')
        fi
        
        if [ -z "$UPDATE_DATE" ]; then
          echo "Warning: Could not extract update date from export page"
          UPDATE_DATE="Unknown"
          DATE_NORMALIZED="unknown"
        fi
        
        if [ "$UPDATE_DATE" != "Unknown" ]; then
          echo "✓ Extracted update date: $UPDATE_DATE"
          # Clean up any extra whitespace
          UPDATE_DATE=$(echo "$UPDATE_DATE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/  */ /g')
          echo "Cleaned date: $UPDATE_DATE"
          
          # Use Python to parse and normalize the date to YYYY-MM-DD
          # Use environment variable to avoid shell escaping issues
          export UPDATE_DATE_VAR="$UPDATE_DATE"
          DATE_NORMALIZED=$(python3 -c "import os; from datetime import datetime; dt = datetime.strptime(os.environ['UPDATE_DATE_VAR'], '%a %b %d %H:%M:%S UTC %Y'); print(dt.strftime('%Y-%m-%d'))" 2>&1 || echo "error-parse-failed")
          
          if [[ "$DATE_NORMALIZED" == error-* ]]; then
            echo "Warning: Could not parse date: $DATE_NORMALIZED"
            DATE_NORMALIZED="unknown"
          else
            echo "Normalized date: $DATE_NORMALIZED"
          fi
        else
          DATE_NORMALIZED="unknown"
        fi
        
        echo "update_date=$UPDATE_DATE" >> $GITHUB_OUTPUT
        echo "normalized_date=$DATE_NORMALIZED" >> $GITHUB_OUTPUT
        echo "Using normalized date for cache: $DATE_NORMALIZED"
    
    - name: Calculate yesterday's date
      id: yesterday
      run: |
        if [ "${{ steps.check-update.outputs.normalized_date }}" != "unknown" ]; then
          YESTERDAY=$(python3 -c "from datetime import datetime, timedelta; dt = datetime.strptime('${{ steps.check-update.outputs.normalized_date }}', '%Y-%m-%d'); print((dt - timedelta(days=1)).strftime('%Y-%m-%d'))" 2>/dev/null || echo "")
          echo "yesterday_date=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "Yesterday's date: $YESTERDAY"
        else
          echo "yesterday_date=" >> $GITHUB_OUTPUT
        fi
    
    - name: Restore yesterday's cache (to get previous files)
      uses: actions/cache@v5
      id: cache-yesterday
      continue-on-error: true
      with:
        path: |
          character/TAKP_character.txt
          inventory/TAKP_character_inventory.txt
          .magelo_update_date
        # Never use an empty date segment (would become key "magelo-dump-" and match unrelated caches).
        key: magelo-dump-${{ steps.yesterday.outputs.yesterday_date || format('invalid-no-yesterday-{0}', github.run_id) }}
    
    - name: Copy yesterday's files to previous (before restoring today's cache)
      if: steps.cache-yesterday.outputs.cache-hit == 'true'
      run: |
        echo "Checking for yesterday's files from cache key: magelo-dump-${{ steps.yesterday.outputs.yesterday_date }}"
        
        # Create directories if needed
        mkdir -p character inventory
        
        # IMPORTANT: At this point, TAKP_character.txt should contain YESTERDAY's data
        # (from the cache restore above). We copy it to _previous.txt BEFORE
        # "Cache magelo dump files" overwrites it with today's data.
        
        if [ -f "character/TAKP_character.txt" ]; then
          # Save the date from yesterday's file if it exists
          if [ -f ".magelo_update_date" ]; then
            YESTERDAY_DATE=$(head -1 .magelo_update_date)
            echo "Yesterday's date from cache: $YESTERDAY_DATE"
          fi
          
          cp character/TAKP_character.txt character/.delta_yesterday_character.txt
          echo "✓ Backed up yesterday character dump (verify before _previous copy)"
          ls -lh character/.delta_yesterday_character.txt
          echo "File size: $(wc -l < character/.delta_yesterday_character.txt) lines"
          if [ -f ".magelo_update_date" ]; then
            cp .magelo_update_date .delta_yesterday_magelo_date.txt
            echo "✓ Backed up yesterday stamp:"; head -1 .delta_yesterday_magelo_date.txt
          fi
          
          # Verify the backup succeeded
          if [ ! -f "character/.delta_yesterday_character.txt" ]; then
            echo "⚠ ERROR: Failed to create yesterday character backup"
            exit 1
          fi
        else
          echo "⚠ Yesterday's character file not found in cache"
          echo "Cache key used: magelo-dump-${{ steps.yesterday.outputs.yesterday_date }}"
          echo "This means yesterday's cache doesn't exist - delta page cannot be generated"
        fi
        
        if [ -f "inventory/TAKP_character_inventory.txt" ]; then
          cp inventory/TAKP_character_inventory.txt inventory/.delta_yesterday_inventory.txt
          echo "✓ Backed up yesterday inventory dump"
          ls -lh inventory/.delta_yesterday_inventory.txt
          echo "File size: $(wc -l < inventory/.delta_yesterday_inventory.txt) lines"
          
          if [ ! -f "inventory/.delta_yesterday_inventory.txt" ]; then
            echo "⚠ ERROR: Failed to create yesterday inventory backup"
            exit 1
          fi
        else
          echo "⚠ Yesterday's inventory file not found in cache"
        fi
        
        if [ -f "character/.delta_yesterday_character.txt" ] && [ -f "inventory/.delta_yesterday_inventory.txt" ]; then
          echo "✓ Yesterday backups ready for fingerprint verify (not copied to _previous yet)"
        else
          echo "⚠ No yesterday backups - delta page will not be generated"
          echo "This is expected if yesterday's cache doesn't exist or expired"
        fi
    
    - name: Note when yesterday Magelo cache missed
      if: steps.cache-yesterday.outputs.cache-hit != 'true'
      run: |
        echo "::warning::Yesterday Actions cache miss for magelo-dump-${{ steps.yesterday.outputs.yesterday_date }} — not populating _previous from workspace files (avoids quarter-scale delta.html). Delta will be skipped unless dated local archives exist."
    
    - name: Cache magelo dump files (current - this will overwrite yesterday's files)
      uses: actions/cache@v5
      id: cache-magelo
      with:
        path: |
          character/TAKP_character.txt
          inventory/TAKP_character_inventory.txt
          .magelo_update_date
        key: magelo-dump-${{ steps.check-update.outputs.normalized_date }}
        restore-keys: |
          magelo-dump-
    
    - name: Check if update is needed
      id: need-update
      run: |
        CURRENT_DATE="${{ steps.check-update.outputs.update_date }}"
        
        # Force download if date extraction failed
        if [ "$CURRENT_DATE" == "Unknown" ]; then
          echo "⚠ Date extraction failed, forcing download to establish baseline"
          echo "needs_update=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        if [ "${{ steps.cache-magelo.outputs.cache-hit }}" == "true" ]; then
          # Check if cached date matches current date
          if [ -f ".magelo_update_date" ]; then
            CACHED_DATE=$(head -1 .magelo_update_date)
            if [ "$CACHED_DATE" == "$CURRENT_DATE" ]; then
              echo "✓ Magelo dump is up to date (date: $CACHED_DATE)"
              echo "needs_update=false" >> $GITHUB_OUTPUT
            else
              echo "Magelo dump needs update (cached: $CACHED_DATE, current: $CURRENT_DATE)"
              echo "needs_update=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No cached date file found, will download to establish date"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "No cache hit, will download"
          echo "needs_update=true" >> $GITHUB_OUTPUT
        fi
    
    # Do NOT copy character/TAKP_character.txt to _previous when yesterday's cache missed:
    # at this point TAKP_character.txt may come from cache-magelo restore-keys (any prior day),
    # which would make delta.html show quarter-scale AA/item inflation vs today's download.
    
    - name: Download magelo dump from TAKP (if update needed)
      if: steps.need-update.outputs.needs_update == 'true'
      run: |
        # Create directories
        mkdir -p character inventory
        
        echo "Downloading character data from TAKP..."
        curl -L -o character/TAKP_character.txt "https://www.takproject.net/magelo/export/TAKP_character.txt" || {
          echo "Error: Failed to download character file"
          exit 1
        }
        
        echo "Downloading inventory data from TAKP..."
        curl -L -o inventory/TAKP_character_inventory.txt "https://www.takproject.net/magelo/export/TAKP_character_inventory.txt" || {
          echo "Error: Failed to download inventory file"
          exit 1
        }
        
        echo "✓ Successfully downloaded magelo dump files"
        echo "Character file size: $(wc -l < character/TAKP_character.txt) lines"
        echo "Inventory file size: $(wc -l < inventory/TAKP_character_inventory.txt) lines"
        echo "Update date: ${{ steps.check-update.outputs.update_date }}"
    
    - name: Save current update date
      run: |
        # Always save the current date from the page (even if we used cache)
        # This ensures the date is available for HTML generation
        UPDATE_DATE="${{ steps.check-update.outputs.update_date }}"
        echo "$UPDATE_DATE" > .magelo_update_date
        echo "Saved update date: $UPDATE_DATE"
        
        # Verify the date was saved correctly
        if [ -f ".magelo_update_date" ]; then
          SAVED_DATE=$(head -1 .magelo_update_date)
          echo "Verified saved date: $SAVED_DATE"
          if [ "$SAVED_DATE" == "Unknown" ]; then
            echo "⚠ Warning: Date is still Unknown, this may indicate extraction failure"
          fi
        else
          echo "⚠ Error: Failed to save update date file"
        fi

    - name: Write Magelo dump fingerprint after save date
      if: steps.check-update.outputs.normalized_date != 'unknown'
      env:
        EXPECTED_DATE: ${{ steps.check-update.outputs.normalized_date }}
      run: python3 scripts/magelo_dump_fingerprint.py write
    
    # Note: We do NOT save current files as previous here because:
    # 1. We already copied yesterday's Actions cache to _previous when cache-yesterday hit (see "Copy yesterday's files").
    # 2. Saving current files here would overwrite the previous files with today's data.
    # 3. Tomorrow's run will restore today's cache as "yesterday" and copy it to previous.
    
    - name: Verify cached/downloaded files
      run: |
        if [ -f "character/TAKP_character.txt" ] && [ -f "inventory/TAKP_character_inventory.txt" ]; then
          echo "✓ Magelo dump files are available"
          echo "Character file: $(wc -l < character/TAKP_character.txt) lines"
          echo "Inventory file: $(wc -l < inventory/TAKP_character_inventory.txt) lines"
        else
          echo "Error: Magelo dump files are missing"
          exit 1
        fi
        
        # Check for previous files
        if [ -f "character/TAKP_character_previous.txt" ] && [ -f "inventory/TAKP_character_inventory_previous.txt" ]; then
          echo "✓ Previous files found - delta page can be generated"
          echo "Previous character file: $(wc -l < character/TAKP_character_previous.txt) lines"
          echo "Previous inventory file: $(wc -l < inventory/TAKP_character_inventory_previous.txt) lines"
          echo "Current character file: $(wc -l < character/TAKP_character.txt) lines"
          echo "Current inventory file: $(wc -l < inventory/TAKP_character_inventory.txt) lines"
          
          # Check if files are identical
          if cmp -s character/TAKP_character_previous.txt character/TAKP_character.txt; then
            echo "⚠ Warning: Previous and current character files are identical - no changes to show"
            echo "This may indicate:"
            echo "  1. No actual changes occurred between dumps"
            echo "  2. Previous files were incorrectly set to today's data (bug)"
            echo "  3. Cache restoration issue"
          else
            echo "✓ Character files are different - changes will be shown"
          fi
          
          # Also check inventory files
          if cmp -s inventory/TAKP_character_inventory_previous.txt inventory/TAKP_character_inventory.txt; then
            echo "⚠ Warning: Previous and current inventory files are identical"
          else
            echo "✓ Inventory files are different - changes will be shown"
          fi
        else
          echo "⚠ No previous files found - delta page will not be generated"
          echo "Files in character/ directory:"
          ls -lh character/ 2>/dev/null || echo "Directory not found"
          echo "Files in inventory/ directory:"
          ls -lh inventory/ 2>/dev/null || echo "Directory not found"
        fi
    
    - name: Verify spell exchange JSON
      run: |
        # Check if JSON file exists (should be in repo)
        if [ ! -f "spell_exchange_list.json" ]; then
          echo "Error: spell_exchange_list.json not found in repository"
          echo "Files in current directory:"
          ls -la
          exit 1
        fi
        echo "✓ Found spell_exchange_list.json"
        echo "File size: $(wc -c < spell_exchange_list.json) bytes"
    
    # Baseline cache for daily delta JSON + leaderboards; align master to Feb 9 single-era anchor.
    - name: Restore baseline cache (needed for daily delta + leaderboards)
      uses: actions/cache@v5
      id: cache-baseline-historical
      continue-on-error: true
      with:
        path: |
          delta_snapshots/baseline_master.json.gz
          delta_snapshots/baseline_master_*.json.gz
          delta_snapshots/baseline_week_*.json
          delta_snapshots/baseline_month_*.json
        key: magelo-baseline-${{ steps.check-update.outputs.normalized_date }}
        restore-keys: |
          magelo-baseline-

    - name: Sync dated baseline archives from master
      run: |
        python scripts/sync_baseline_master_archive_from_master.py --base-dir delta_snapshots

    # Single baseline era (2026-02-09): align master to the Feb anchor (see delta_snapshots/ABANDONED_DATES.txt).
    - name: Align baseline_master.json.gz to Feb 9 archive when present
      run: |
        if [ -f "delta_snapshots/baseline_master_2026-02-09.json.gz" ]; then
          cp -f "delta_snapshots/baseline_master_2026-02-09.json.gz" "delta_snapshots/baseline_master.json.gz"
          echo "OK: baseline_master.json.gz copied from baseline_master_2026-02-09.json.gz"
        else
          echo "No baseline_master_2026-02-09.json.gz; leaving baseline_master.json.gz unchanged"
        fi

    # Verify _previous from early yesterday backup (no second cache restore — same key
    # cannot be restored twice per job, and extra cache paths break version match).
    - name: Fail if yesterday Magelo cache missing for delta
      if: steps.yesterday.outputs.yesterday_date != '' && steps.cache-yesterday.outputs.cache-hit != 'true'
      run: |
        echo "::error::No Actions cache hit for magelo-dump-${{ steps.yesterday.outputs.yesterday_date }}. Delta needs the prior day's dump cache (see Caches in repo settings). Yesterday's date from export: ${{ steps.yesterday.outputs.yesterday_date }}"
        exit 1

    - name: Prepare _previous from yesterday cache (verify or skip stale)
      id: prepare-previous
      if: steps.yesterday.outputs.yesterday_date != '' && steps.cache-yesterday.outputs.cache-hit == 'true'
      env:
        EXPECTED_YESTERDAY_DATE: ${{ steps.yesterday.outputs.yesterday_date }}
        EXPORT_DATE: ${{ steps.check-update.outputs.normalized_date }}
        YESTERDAY_CHAR: character/.delta_yesterday_character.txt
        YESTERDAY_INV: inventory/.delta_yesterday_inventory.txt
        YESTERDAY_STAMP: .delta_yesterday_magelo_date.txt
      run: python3 scripts/prepare_magelo_previous_for_ci.py

    - name: Verify current vs previous (delta input check)
      if: steps.prepare-previous.outputs.skip_dump_delta != 'true'
      run: |
        echo "=== Delta input check: current vs previous ==="
        if [ ! -f "character/TAKP_character_previous.txt" ] || [ ! -f "character/TAKP_character.txt" ]; then
          echo "::warning::Missing current or previous character file - delta page may be wrong or missing."
          exit 0
        fi
        if cmp -s character/TAKP_character.txt character/TAKP_character_previous.txt; then
          echo "::error::Current and previous character files are IDENTICAL. Delta will show no real changes (or wrong data). This usually means today's data was overwritten by cache/backfill - check backup restore and cache order."
          echo "Character file lines - current: $(wc -l < character/TAKP_character.txt) previous: $(wc -l < character/TAKP_character_previous.txt)"
          exit 1
        fi
        if cmp -s inventory/TAKP_character_inventory.txt inventory/TAKP_character_inventory_previous.txt; then
          echo "::warning::Current and previous inventory files are IDENTICAL. Inventory delta will be empty."
        fi
        echo "✓ Current and previous character files differ - delta comparison is valid."
        
        # Fail before generate_spell_page.py if stamps show >2 calendar days between exports (stale _previous).
        if [ -f ".magelo_previous_dump_date.txt" ] && [ -f ".magelo_update_date" ]; then
          EXPECTED_PREVIOUS_DATE="${{ steps.yesterday.outputs.yesterday_date }}" python3 scripts/validate_magelo_delta_date_span.py
        fi
    
    # Restore mob_tracker_deaths.json from last deploy so we merge with existing deaths (file is not in repo).
    - name: Fetch current mob tracker deaths from Pages (for persistence across runs)
      continue-on-error: true
      run: |
        PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        echo "Fetching mob_tracker_deaths.json from $PAGES_URL for merge with today's run..."
        if curl -sfL "${PAGES_URL}/mob_tracker_deaths.json" -o mob_tracker_deaths.json; then
          echo "✓ Restored mob_tracker_deaths.json from Pages (will merge with today's delta)"
        else
          echo "No existing file on Pages; script will create fresh."
        fi
    
    - name: Run spell inventory generator
      env:
        MAGELO_UPDATE_DATE: ${{ steps.check-update.outputs.update_date }}
      run: |
        # Verify the date is set
        echo "Using magelo update date from environment: $MAGELO_UPDATE_DATE"
        
        # Also check if date file exists and show its contents
        if [ -f ".magelo_update_date" ]; then
          FILE_DATE=$(head -1 .magelo_update_date)
          echo "Date from file: $FILE_DATE"
        else
          echo "⚠ Warning: .magelo_update_date file not found"
        fi
        
        # Run the generator
        echo "Running Python script to generate pages..."
        python generate_spell_page.py
        
        # Verify the date appears in the generated HTML
        if [ -f "spell_inventory.html" ]; then
          echo "✓ spell_inventory.html generated"
          if grep -q "last updated: $MAGELO_UPDATE_DATE" spell_inventory.html; then
            echo "✓ Date successfully included in HTML"
          else
            echo "⚠ Warning: Date may not be in HTML, checking..."
            grep -o "last updated: [^<]*" spell_inventory.html | head -1 || echo "Could not find date in HTML"
          fi
        else
          echo "⚠ Error: spell_inventory.html was not generated"
        fi
        
        if [ -f "delta.html" ]; then
          echo "✓ delta.html was generated ($(wc -c < delta.html) bytes)"
        else
          echo "⚠ delta.html was NOT generated"
        fi

    - name: Verify delta baseline archives and daily metadata
      run: |
        python scripts/verify_delta_baseline_archives.py --base-dir delta_snapshots

    - name: Audit recent gear event shards
      if: steps.check-update.outputs.normalized_date != 'unknown'
      run: |
        FROM=$(python3 -c "from datetime import datetime, timedelta; d='${{ steps.check-update.outputs.normalized_date }}'; print((datetime.strptime(d,'%Y-%m-%d')-timedelta(days=7)).strftime('%Y-%m-%d'))")
        python scripts/audit_gear_events.py \
          --base-dir delta_snapshots \
          --min-events-after "$FROM" \
          --fail-on-issue
    - name: Generate Class Rankings
      env:
        MAGELO_UPDATE_DATE: ${{ steps.check-update.outputs.update_date }}
      run: |
        echo "Generating class rankings..."
        FOCUS_FILE=""
        if [ -f "spell_focii_level65.json" ]; then
          FOCUS_FILE="spell_focii_level65.json"
        elif [ -f "../Server/spell_focii_level65.json" ]; then
          cp "../Server/spell_focii_level65.json" spell_focii_level65.json
          FOCUS_FILE="spell_focii_level65.json"
        elif [ -f "../../Server/spell_focii_level65.json" ]; then
          cp "../../Server/spell_focii_level65.json" spell_focii_level65.json
          FOCUS_FILE="spell_focii_level65.json"
        else
          echo "::warning::spell_focii_level65.json not found; skipping class rankings"
        fi
        if [ -n "$FOCUS_FILE" ] || [ -f "spell_focii_level65.json" ]; then
          python generate_class_rankings.py || echo "::warning::Class rankings generation had issues"
        fi
        if [ -f "class_rankings.html" ] && [ -f "class_rankings.json" ]; then
          echo "✓ class_rankings.html and class_rankings.json generated"
        else
          echo "::warning::Class rankings files were not generated"
        fi

    - name: Verify HTML was generated
      run: |
        if [ ! -f "spell_inventory.html" ]; then
          echo "::error::spell_inventory.html was not generated"
          exit 1
        fi
        echo "✓ spell_inventory.html ($(wc -c < spell_inventory.html) bytes)"
        if [ -f "delta.html" ]; then
          echo "✓ delta.html ($(wc -c < delta.html) bytes)"
          if grep -q "No.*changes detected" delta.html; then
            echo "::warning::Delta page shows 'No changes detected'"
          fi
        else
          echo "::warning::delta.html was NOT generated"
        fi
        if [ -f "class_rankings.html" ]; then
          echo "✓ class_rankings.html ($(wc -c < class_rankings.html) bytes)"
        else
          echo "::warning::class_rankings.html was NOT generated"
        fi
    
    # --- Persistence: gear event shards and baselines are committed; HTML is deploy-only.
    # - History: delta_snapshots/gear_events/ (append-only; committed below).
    # - Baseline: baseline_master.json.gz (+ archived baseline_master_YYYY-MM-DD.json.gz) cached and deployed.
    # - Pages (HTML): Generated each run; copied to deploy only (not committed).
    # - Legacy delta_daily_*.json.gz are not in repo (gear_events supersede them).
    - name: Commit gear event shards to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add delta_snapshots/gear_events/ 2>/dev/null || true
        git add delta_snapshots/baseline_master_*.json.gz 2>/dev/null || true
        git add delta_snapshots/baseline_master.json.gz 2>/dev/null || true
        if git diff --staged --quiet; then
          echo "No new gear event files to commit"
        else
          git commit -m "Add gear event log shards from CI run"
          git push
        fi

    # Regenerate item_name_to_id.json from raid_item_sources so item cards resolve on the live site
    # (runs without dkp_mob_loot in CI; uses raid_item_sources only)
    - name: Regenerate item_name_to_id.json for item cards
      run: |
        python merge_dkp_loot_into_raid_sources.py --write-name-to-id
        if [ -f "data/item_name_to_id.json" ]; then
          echo "✓ item_name_to_id.json ready for deploy ($(wc -l < data/item_name_to_id.json) lines)"
          # Verify key items (e.g. Cap of Flowing Time) are present so item cards work on live site
          for key in "cap of flowing time" "mask of strategic insight" "amulet of crystal dreams" "bracer of precision"; do
            if grep -q "\"$key\"" data/item_name_to_id.json; then
              echo "  ✓ $key"
            else
              echo "  ✗ MISSING: $key (item cards may not resolve for this item)"
            fi
          done
        else
          echo "⚠ data/item_name_to_id.json not found (item cards may not resolve on live site)"
        fi

    - name: Merge Magelo inventory names into item_id_to_name.json
      run: |
        if [ ! -f "data/item_id_to_name.json" ]; then
          echo "::error::data/item_id_to_name.json is missing - run scripts/build_item_id_to_name.py locally and commit"
          exit 1
        fi
        python scripts/build_item_id_to_name.py --skip-db --inventory inventory/TAKP_character_inventory.txt
        echo "✓ item_id_to_name.json ready ($(python -c "import json; print(len(json.load(open('data/item_id_to_name.json'))))") entries)"

    - name: Restore delta.html when dump diff skipped
      if: steps.prepare-previous.outputs.skip_dump_delta == 'true'
      run: |
        if [ -f "deploy/delta_fallback.html" ]; then
          cp deploy/delta_fallback.html delta.html
          echo "✓ Restored delta.html from repo deploy/delta_fallback.html (verified local Jul3→Jul4 diff)"
        else
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if curl -sfL "${PAGES_URL}/delta.html" -o delta.html; then
            echo "✓ Restored delta.html from live Pages (fallback)"
          else
            echo "::warning::No delta.html fallback; deploy may omit delta page"
          fi
        fi

    - name: Prepare for deployment
      run: |
        # Create a clean directory with the HTML files
        mkdir -p deploy
        cp spell_inventory.html deploy/index.html
        # Copy delta page if it was generated
        if [ -f "delta.html" ]; then
          cp delta.html deploy/delta.html
          echo "✓ Copied delta.html to deploy directory"
        else
          echo "No delta.html found (previous day's files may not exist)"
        fi
        # Copy mob repop tracker page and its data (generated alongside delta)
        if [ -f "mob_tracker.html" ]; then
          cp mob_tracker.html deploy/mob_tracker.html
          echo "✓ Copied mob_tracker.html to deploy directory"
        fi
        if [ -f "mob_tracker_deaths.json" ]; then
          cp mob_tracker_deaths.json deploy/mob_tracker_deaths.json
          echo "✓ Copied mob_tracker_deaths.json to deploy directory"
        fi
        if [ -f "raid_item_sources.json" ]; then
          cp raid_item_sources.json deploy/raid_item_sources.json
          echo "✓ Copied raid_item_sources.json to deploy directory (for mob tracker)"
        fi
        # Copy delta JSON files to deploy (needed for client-side date range queries)
        # Note: We only copy the compressed JSONs, and they're loaded on-demand by JavaScript
        mkdir -p deploy/delta_snapshots
        if [ -d "delta_snapshots" ]; then
          # Gear event shards (primary history store)
          if [ -d "delta_snapshots/gear_events" ]; then
            mkdir -p deploy/delta_snapshots/gear_events
            cp -r delta_snapshots/gear_events/* deploy/delta_snapshots/gear_events/ 2>/dev/null || echo "No gear_events to copy"
            GEAR_SHARDS=$(ls deploy/delta_snapshots/gear_events/gear_*.json.gz 2>/dev/null | wc -l)
            echo "✓ Copied $GEAR_SHARDS gear event shard(s)"
          fi
          # Legacy cumulative dailies: omit from Pages when gear_events shards exist
          # (delta-history uses USE_GEAR_EVENTS; saves ~100MB on deploy). Keep fallback
          # only when no gear shards are present (e.g. first run before backfill).
          if [ -d "deploy/delta_snapshots/gear_events" ] && [ "$(ls deploy/delta_snapshots/gear_events/gear_*.json.gz 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✓ Skipping legacy delta_daily_*.json.gz on Pages (gear_events shards deployed)"
            DELTA_COUNT=0
          else
            cp delta_snapshots/delta_daily_*.json.gz deploy/delta_snapshots/ 2>/dev/null || echo "No legacy delta JSON files to copy"
            DELTA_COUNT=$(ls deploy/delta_snapshots/delta_daily_*.json.gz 2>/dev/null | wc -l)
            if [ "$DELTA_COUNT" -gt 0 ]; then
              echo "✓ Copied $DELTA_COUNT legacy delta JSON files (gear_events fallback)"
            else
              echo "⚠ No delta JSON files found to copy"
            fi
          fi
          # Copy baseline files (needed for client-side date range comparisons across baseline resets).
          # Only .gz baselines are deployed (uncompressed baseline_master.json is ~200MB+).
          cp delta_snapshots/baseline_master*.json.gz deploy/delta_snapshots/ 2>/dev/null || echo "No compressed baseline files to copy"
          BASELINE_COUNT=$(ls deploy/delta_snapshots/baseline_master*.json.gz 2>/dev/null | wc -l)
          if [ "$BASELINE_COUNT" -gt 0 ]; then
            echo "✓ Copied $BASELINE_COUNT baseline files to deploy/delta_snapshots/"
          else
            echo "⚠ No baseline files found to copy (client-side date range comparisons may not work)"
          fi
          # Calculate total size
          TOTAL_SIZE=$(du -sh deploy/delta_snapshots/ | cut -f1)
          echo "  Total size: $TOTAL_SIZE (compressed)"
        fi
        # Copy class rankings files if they were generated
        if [ -f "class_rankings.html" ]; then
          cp class_rankings.html deploy/class_rankings.html
          echo "✓ Copied class_rankings.html to deploy directory"
        fi
        if [ -f "class_rankings.json" ]; then
          cp class_rankings.json deploy/class_rankings.json
          echo "✓ Copied class_rankings.json to deploy directory"
        fi
        # Copy item_stats.json and item_name_to_id.json for class rankings item card hover (data/ relative to site root)
        # Required: without these, item cards show "no details in the database" (e.g. Cap of Flowing Time)
        mkdir -p deploy/data
        if [ ! -f "data/item_stats.json" ]; then
          echo "::error::data/item_stats.json is missing in repo - item cards will show 'no details in the database'. Run: python scripts/copy_dkp_item_stats_to_magelo.py and commit data/item_stats.json"
          exit 1
        fi
        cp data/item_stats.json deploy/data/item_stats.json
        echo "✓ Copied data/item_stats.json to deploy (for item cards)"
        if [ -f "data/item_name_to_id.json" ]; then
          cp data/item_name_to_id.json deploy/data/item_name_to_id.json
          echo "✓ Copied data/item_name_to_id.json to deploy (name→id resolution for item cards)"
        else
          echo "::warning::data/item_name_to_id.json missing - item cards (e.g. Cap of Flowing Time) will not resolve on live site"
        fi
        if [ ! -f "data/item_id_to_name.json" ]; then
          echo "::error::data/item_id_to_name.json is missing - char timeline will show Item IDs"
          exit 1
        fi
        cp data/item_id_to_name.json deploy/data/item_id_to_name.json
        echo "✓ Copied data/item_id_to_name.json to deploy (id→name resolution for char timeline)"
        # Copy elemental_display_names.json for class rankings (elemental piece display names when item_stats has no name)
        if [ -f "data/elemental_display_names.json" ]; then
          cp data/elemental_display_names.json deploy/data/elemental_display_names.json
          echo "✓ Copied data/elemental_display_names.json to deploy (elemental upgrade labels)"
        fi
        # Copy elemental_slot_options.json for class rankings Gear upgrades (slot -> pattern -> by_class; click shows class stats)
        if [ -f "data/elemental_slot_options.json" ]; then
          cp data/elemental_slot_options.json deploy/data/elemental_slot_options.json
          echo "✓ Copied data/elemental_slot_options.json to deploy (elemental loot by class on comparison card)"
        else
          echo "Optional: data/elemental_slot_options.json not found - run scripts/build_elemental_slot_options.py and commit"
        fi
        # Copy dkp_prices.json for class_rankings.html?dkp_val=true (HP/DKP upgrade metrics)
        if [ -f "data/dkp_prices.json" ]; then
          cp data/dkp_prices.json deploy/data/dkp_prices.json
          echo "✓ Copied data/dkp_prices.json to deploy (class rankings DKP values)"
        else
          echo "Optional: data/dkp_prices.json not found - ?dkp_val=true on class rankings will show no DKP data"
        fi
        # Copy DPS calculator pages and data (weapon_procs.json proc DPS; weapon_threat_server.json for hate; dps_config for AAs)
        if [ -f "dps_calculator.html" ]; then
          cp dps_calculator.html deploy/dps_calculator.html
          echo "✓ Copied dps_calculator.html to deploy directory"
        fi
        if [ -f "dps_calculator_guide.html" ]; then
          cp dps_calculator_guide.html deploy/dps_calculator_guide.html
          echo "✓ Copied dps_calculator_guide.html to deploy directory"
        fi
        if [ -f "data/dps_config.json" ]; then
          cp data/dps_config.json deploy/data/dps_config.json
          echo "✓ Copied data/dps_config.json to deploy (DPS calculator AAs)"
        fi
        if [ -f "data/weapon_procs.json" ]; then
          cp data/weapon_procs.json deploy/data/weapon_procs.json
          echo "✓ Copied data/weapon_procs.json to deploy (DPS calculator proc DPS)"
        fi
        if [ -f "data/weapon_threat_server.json" ]; then
          cp data/weapon_threat_server.json deploy/data/weapon_threat_server.json
          echo "✓ Copied data/weapon_threat_server.json to deploy (DPS calculator server-model hate/sec)"
        fi
        if [ -f "data/DPS_CALCULATOR_THREAT.md" ]; then
          cp data/DPS_CALCULATOR_THREAT.md deploy/data/DPS_CALCULATOR_THREAT.md
          echo "✓ Copied data/DPS_CALCULATOR_THREAT.md to deploy (DPS calculator threat doc link)"
        fi
        # Copy scoring explanation page
        if [ -f "scoring_explanation.html" ]; then
          cp scoring_explanation.html deploy/scoring_explanation.html
          echo "✓ Copied scoring_explanation.html to deploy directory"
        fi
        # Copy delta history page if it was generated
        if [ -f "delta-history.html" ]; then
          cp delta-history.html deploy/delta-history.html
          echo "✓ Copied delta-history.html to deploy directory"
        fi
        # Copy historical delta reports (delta_YYYY-MM-DD.html)
        for file in delta_*.html; do
          if [ -f "$file" ]; then
            cp "$file" deploy/
            echo "✓ Copied historical delta: $file"
          fi
        done
        # Generate delta history page (delta_snapshots is in root, not deploy)
        python -c "from generate_spell_page import generate_delta_history; import os; generate_delta_history('.')"
        if [ -f "delta-history.html" ]; then
          cp delta-history.html deploy/delta-history.html
          echo "✓ Generated and copied delta-history.html to deploy directory"
        fi
        python -c "from generate_spell_page import generate_char_timeline; import os; generate_char_timeline('.')"
        if [ -f "char.html" ]; then
          cp char.html deploy/char.html
          echo "✓ Generated and copied char.html to deploy directory"
        fi
        # Copy weekly/monthly leaderboard pages (all of them to preserve history)
        # First copy any existing leaderboards from previous runs (if keep_files is true)
        # Then copy newly generated ones
        for file in leaderboard_week_*.html leaderboard_month_*.html; do
          if [ -f "$file" ]; then
            cp "$file" deploy/
            echo "✓ Copied $file to deploy directory"
          fi
        done
        # Also check deploy directory for existing leaderboards to preserve
        if [ -d "deploy" ]; then
          for file in deploy/leaderboard_week_*.html deploy/leaderboard_month_*.html deploy/delta_*.html; do
            if [ -f "$file" ]; then
              echo "Preserving existing file: $(basename $file)"
            fi
          done
        fi
        # Add .nojekyll to disable Jekyll processing
        touch deploy/.nojekyll
        echo "✓ Prepared HTML files for GitHub Pages"
        echo "✓ Added .nojekyll to disable Jekyll"
    
    - name: Upload Pages artifact
      id: upload
      uses: actions/upload-pages-artifact@v4
      if: github.ref == 'refs/heads/main'
      with:
        path: ./deploy
        name: github-pages-${{ github.run_id }}
        retention-days: 3
    
    # Cache baselines (master + weekly/monthly for leaderboards); deltas live in repo
    - name: Cache baselines
      uses: actions/cache@v5
      id: cache-baseline
      with:
        path: |
          delta_snapshots/baseline_master.json.gz
          delta_snapshots/baseline_master_*.json.gz
          delta_snapshots/baseline_week_*.json
          delta_snapshots/baseline_month_*.json
        key: magelo-baseline-${{ steps.check-update.outputs.normalized_date }}
        restore-keys: |
          magelo-baseline-
    
    - name: Write Magelo dump fingerprint for cache
      if: steps.check-update.outputs.normalized_date != 'unknown'
      env:
        EXPECTED_DATE: ${{ steps.check-update.outputs.normalized_date }}
      run: python3 scripts/magelo_dump_fingerprint.py write

    - name: Cache current files for next run
      uses: actions/cache@v5
      with:
        path: |
          character/TAKP_character.txt
          inventory/TAKP_character_inventory.txt
          .magelo_update_date
        key: magelo-dump-${{ steps.check-update.outputs.normalized_date }}
        restore-keys: |
          magelo-dump-

  deploy:
    needs: update-spell-inventory
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
      - name: Verify deployment
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          EXPORT_DATE: ${{ needs.update-spell-inventory.outputs.normalized_date }}
        run: |
          echo "Pages URL: $PAGES_URL/"
          for path in index.html delta.html char.html; do
            if curl -sfL "$PAGES_URL/$path" -o /dev/null; then
              echo "✓ $path"
            else
              echo "::error::Missing or unreachable: $PAGES_URL/$path"
              exit 1
            fi
          done
          if [ -n "$EXPORT_DATE" ] && [ "$EXPORT_DATE" != "unknown" ]; then
            MONTH=$(echo "$EXPORT_DATE" | cut -c1-7)
            GEAR="delta_snapshots/gear_events/gear_${MONTH}.json.gz"
            if curl -sfL "$PAGES_URL/$GEAR" -o /dev/null; then
              echo "✓ $GEAR"
            else
              echo "::warning::Gear event shard not on Pages yet: $GEAR"
            fi
          fi
